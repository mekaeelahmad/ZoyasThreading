<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Thanks — Zoya's Threading</title>
    <link rel="icon" type="image/png" href="logo_no_name.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="Zoya's Threading home">
          <img
            class="brand-mark"
            src="logo_no_name.png"
            alt=""
            width="48"
            height="48"
          />
          <span class="brand-text">
            Zoya's
            <small>Threading</small>
          </span>
        </a>
      </div>
    </header>

    <main class="thank-you-main">
      <div class="container thank-you-inner">
        <img
          class="thank-you-logo"
          src="logo_with_name.png"
          alt="Zoya's Threading"
          width="280"
          height="320"
        />
        <h1>Thank you</h1>
        <p class="thank-you-lead">
          Your appointment request was sent. We’ll reply to the email you
          provided to confirm your date and time.
        </p>
        <p>
          <a class="btn btn-primary" href="index.html">Back to home</a>
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          <strong>Zoya's Threading</strong><br />
          3045 Wilderness Drive
        </p>
      </div>
    </footer>
  </body>
</html>
